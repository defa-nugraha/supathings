name: Temporary cultivation format diagnostics
on:
  push:
    branches:
      - feat/cultivation-navigation-modals
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and print diffs
        run: |
          npm run check:fix
          git diff -- resources/js/components/app-sidebar-header.tsx resources/js/components/app-sidebar.tsx resources/js/pages/cultivation-history.tsx resources/js/pages/cultivation-journal.tsx resources/js/pages/cultivation.tsx
