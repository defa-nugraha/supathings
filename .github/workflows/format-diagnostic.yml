name: Format diagnostic
on:
  push:
    branches:
      - feat/cultivation-date-format-buttons
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check:fix
      - name: Show formatting diff
        run: git diff -- resources/js/pages/cultivation.tsx resources/js/pages/cultivation-history.tsx resources/js/pages/cultivation-journal.tsx