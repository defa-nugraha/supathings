name: One-time frontend formatting
on:
  push:
    branches:
      - feat/crud-cultivation-expenses
    paths:
      - .github/workflows/format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crud-cultivation-expenses
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:fix
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js
          if ! git diff --cached --quiet; then
            git commit -m "Apply frontend formatting"
            git push origin feat/crud-cultivation-expenses
          fi
