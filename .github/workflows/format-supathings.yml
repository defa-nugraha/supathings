name: format-supathings

on:
  push:
    branches:
      - feat/supathings-iot-dashboard

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: composer setup
      - name: Format frontend
        run: npm run check:fix
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/css/app.css resources/js/components/app-logo.tsx resources/js/components/app-sidebar.tsx resources/js/pages/dashboard.tsx resources/js/pages/devices.tsx resources/js/pages/monitoring.tsx resources/js/pages/welcome.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format Supathings frontend"
            git push
          fi
      - name: Run CI checks
        run: composer ci:check
