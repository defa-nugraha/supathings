name: Temporary adaptive UI formatting

on:
  push:
    branches:
      - feat/adaptive-mobile-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:fix
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/mobile-bottom-nav.tsx resources/js/pages/dashboard.tsx
          git commit -m "Format adaptive mobile UI"
          git push
