name: Temporary coach-mark formatter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-coachmarks]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository formatter
        run: npm run check:fix
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format coach mark focus targets"
            git push origin HEAD:main
          fi
