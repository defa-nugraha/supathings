name: Temporary format repair

on:
  push:
    branches:
      - feat/crud-cultivation-expenses

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, 'Temporary formatter runner') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crud-cultivation-expenses
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vp check --fix resources/js/pages/devices.tsx
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- resources/js/pages/devices.tsx; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/devices.tsx
          git commit -m "chore: format devices page"
          git push
