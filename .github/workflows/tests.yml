name: Supathings CI

on:
  push:
    branches:
      - main
      - feat/supathings-iot-dashboard
  pull_request:
    branches:
      - main
      - feat/supathings-iot-dashboard

permissions:
  contents: read

concurrency:
  group: supathings-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint → Pint → Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Frontend lint and formatting checks
        run: npm run check

      - name: Laravel Pint style check
        run: composer lint:check

      - name: PHP static analysis
        run: composer types:check

      - name: Build frontend assets for feature tests
        run: npm run build

      - name: Unit and feature tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test
